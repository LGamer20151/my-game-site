<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal 1.20 Minecraft Client</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .overlay-bar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 20px;
            color: #fff;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Self-contained instance wrapper linking directly to raw content execution -->
        <iframe 
            id="minecraft-frame"
            src="game.html" 
            allow="fullscreen; autoplay; gamepad; keyboard; clipboard-read; clipboard-write;">
        </iframe>
        <div class="overlay-bar">⚡ Independent 1.20 Host Active</div>
    </div>

    <script>
        // Automatic viewport focus handler to catch keyboard controls instantly
        window.addEventListener('click', () => {
            const frame = document.getElementById('minecraft-frame');
            if(frame) frame.focus();
        });
    </script>
</body>
</html>
